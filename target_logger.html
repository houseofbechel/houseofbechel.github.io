<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CMP M1 Carbine Target Logger</title>
<style>
  /* "Forest Floor" nature palette:
     #1f3b2c deep forest green (base), #4a3a2a bark brown (panels),
     #6b7f3a moss olive (primary accent), #8b7b5a dry-leaf tan (secondary/muted),
     #d7d2c7 birch cream (text). Danger/warn use earthy tones outside the base
     5 hex codes since the palette has no red/amber, and alerts need to stand out. */
  :root{
    --bg:#1f3b2c; --panel:#4a3a2a; --panel2:#6b7f3a; --border:#8b7b5a;
    --text:#d7d2c7; --muted:#8b7b5a; --accent:#6b7f3a; --accent2:#8b7b5a;
    --danger:#a13d2f; --warn:#c9a227; --pending:#8b7b5a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{padding:10px;padding-bottom:60px;}
  h1{font-size:1.3rem;margin:0 0 10px;text-align:center;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin-bottom:12px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  select, button{font-size:1rem;padding:10px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;}
  select{flex:1;min-width:220px;}
  button{font-weight:600;}
  button:active{transform:scale(0.97);}
  button.primary{background:var(--accent2);color:#1f3b2c;border-color:var(--accent2);}
  button.danger{background:var(--danger);color:#f2e9d8;border-color:var(--danger);}
  button.warn{background:var(--warn);color:#2a1e00;border-color:var(--warn);}
  button:disabled{opacity:0.4;cursor:not-allowed;}

  #timerDisplay{font-size:4rem;font-weight:800;text-align:center;letter-spacing:2px;
    font-variant-numeric:tabular-nums;padding:10px 0;}
  #timerDisplay.expired{color:var(--danger);animation:flash 0.6s infinite;}
  @keyframes flash{0%,100%{background:transparent;}50%{background:#5c261c;}}
  .stageLabel{text-align:center;color:var(--muted);font-size:0.95rem;margin-bottom:4px;}

  .logShotWrap{text-align:center;}
  #logShotBtn{width:100%;max-width:520px;height:110px;font-size:1.8rem;font-weight:800;
    background:var(--accent);color:#d7d2c7;border-color:var(--accent);border-radius:14px;}
  #logShotBtn:disabled{background:var(--panel2);color:var(--muted);}
  .shotCountBig{font-size:1.1rem;color:var(--muted);margin-top:6px;}

  .targetWrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;}
  #targetSvg{background:#d7d2c7;border-radius:8px;touch-action:manipulation;max-width:100%;height:auto;}
  .scoreButtons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:10px auto 0;}
  .scoreButtons button{padding:14px 4px;font-size:1.1rem;}
  .activeShotInfo{text-align:center;font-size:1.05rem;margin-bottom:8px;}
  .activeShotInfo b{color:var(--warn);}

  table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);}
  tr.pending{color:var(--pending);font-style:italic;}
  tr.active{outline:2px solid var(--warn);background:#3a5240;}
  tr{cursor:pointer;}
  .tableScroll{max-height:280px;overflow-y:auto;}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
  .statBox{background:var(--panel2);border-radius:8px;padding:10px;text-align:center;}
  .statBox .val{font-size:1.4rem;font-weight:800;}
  .statBox .lbl{color:var(--muted);font-size:0.75rem;text-transform:uppercase;}

  .footerRow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .hint{color:var(--muted);font-size:0.85rem;text-align:center;margin-top:4px;}
</style>
</head>
<body>

<h1>CMP M1 Carbine Match &mdash; Target Logger</h1>

<!-- ============================================================
     STAGE SELECTOR & TIMER
     ============================================================ -->
<div class="panel">
  <div class="row">
    <select id="stageSelect"></select>
  </div>
  <div class="stageLabel" id="stageLabel"></div>
  <div id="timerDisplay">00:00</div>
  <div class="row" style="justify-content:center;">
    <button class="primary" id="startBtn">Start Stage</button>
    <button id="pauseBtn">Pause</button>
    <button class="warn" id="resetBtn">Reset Timer</button>
  </div>
</div>

<!-- ============================================================
     PHASE 1: LIVE SHOT LOGGING
     No target interaction happens here. The shooter only presses
     one button, as fast or as rarely as the string requires. Timer
     values (split / elapsed) are captured at the moment of the
     press; scoring is deferred entirely to Phase 2.
     ============================================================ -->
<div class="panel logShotWrap">
  <button id="logShotBtn">LOG SHOT</button>
  <div class="shotCountBig" id="shotCountBig">Shots fired this stage: 0</div>
</div>

<!-- ============================================================
     PHASE 2: POST-STRING SCORING
     ============================================================ -->
<div class="panel">
  <div class="activeShotInfo" id="activeShotInfo">No pending shots.</div>
  <div class="targetWrap">
    <svg id="targetSvg" width="360" height="360" viewBox="-100 -100 200 200"></svg>
    <div>
      <div class="scoreButtons" id="scoreButtons"></div>
      <div class="hint">Tap the target for a scored location, or tap a score button for a score-only entry (no X/Y).</div>
    </div>
  </div>
</div>

<!-- ============================================================
     SHOT LOG & STATS
     ============================================================ -->
<div class="panel">
  <div class="tableScroll">
    <table>
      <thead>
        <tr><th>Shot#</th><th>Score</th><th>Split</th><th>Elapsed</th><th>Location (X,Y in.)</th></tr>
      </thead>
      <tbody id="shotLogBody"></tbody>
    </table>
  </div>
</div>

<div class="panel">
  <div class="stats">
    <div class="statBox"><div class="val" id="statScore">0</div><div class="lbl">Stage Score</div></div>
    <div class="statBox"><div class="val" id="statX">0</div><div class="lbl">X-Count</div></div>
    <div class="statBox"><div class="val" id="statSplit">--</div><div class="lbl">Avg Split (s)</div></div>
    <div class="statBox"><div class="val" id="statCentroid">--</div><div class="lbl">Group Bias</div></div>
  </div>
</div>

<div class="panel footerRow">
  <button class="primary" id="exportBtn">Export Session CSV</button>
  <button class="danger" id="clearBtn">Clear Session (New Session)</button>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   STAGE DEFINITIONS
   Each stage has its own timer duration (seconds) and its own
   independent shot log, autosaved to localStorage by stage name.
   ============================================================ */
const STAGES = [
  { key:"s1_sighters", name:"Stage 1: Prone Slow — Sighters", duration:300  },
  { key:"s1_record",   name:"Stage 1: Prone Slow — Record",   duration:600  },
  { key:"s2_rapid",    name:"Stage 2: Prone Rapid",            duration:70   },
  { key:"s3_rapid",    name:"Stage 3: Seated Rapid",           duration:60   },
  { key:"s4_standing", name:"Stage 4: Standing Slow",          duration:600  }
];

const STORAGE_PREFIX = "targetLogger.stage.";
const SESSION_STAGES_KEY = "targetLogger.sessionStages"; // list of stage keys ever used

/* ============================================================
   SR-1 TARGET RING GEOMETRY (100-yard reduction of 200-yd SR)
   True diameters in inches. Rings are drawn to scale relative to
   each other so pixel<->inch conversion is accurate for scoring
   and centroid math. The 5-ring's rendered radius defines
   pixelsPerInch, per spec.
   ============================================================ */
const RING_DIAMETERS_IN = { X:1.35, 10:3.35, 9:6.35, 8:9.35, 7:12.35, 6:15.35, 5:18.35 };
const RING_ORDER = ["X","10","9","8","7","6","5"]; // smallest (highest score) first

// SVG viewBox is -100..100 in both axes (200x200 user units), target face fills ~180 units diameter.
const SVG_HALF = 100;
const FIVE_RING_RADIUS_PX = 90; // rendered radius (svg units) of the 5-ring (18.35in diameter)
const pixelsPerInch = FIVE_RING_RADIUS_PX / (RING_DIAMETERS_IN["5"] / 2);

/* ============================================================
   SIGN CONVENTION (documented per spec requirement):
   X (horizontal): positive = RIGHT of center, negative = LEFT.
   Y (vertical):   positive = HIGH (up) of center, negative = LOW (down).
   This matches typical shooter language: "0.5 in High / 0.3 in Right".
   Screen/SVG pixel Y increases downward, so pixel->inch Y is negated.
   ============================================================ */

/* ============================================================
   STATE
   ============================================================ */
let currentStageKey = STAGES[0].key;
let state = null;         // current stage's persisted state object
let timerInterval = null;
let audioCtx = null;

function defaultStageState(stageKey){
  const def = STAGES.find(s=>s.key===stageKey);
  return {
    stageKey: stageKey,
    duration: def.duration,
    remaining: def.duration,
    running: false,
    startEpoch: null,      // epoch ms when Start was last pressed (for elapsed calc while running)
    elapsedAtPause: 0,     // accumulated elapsed seconds when paused
    lastShotElapsed: null, // elapsed seconds at previous Log Shot press (for split calc)
    expired: false,
    shots: []              // {num, score, x, y, split, elapsed}
  };
}

function loadStage(stageKey){
  const raw = localStorage.getItem(STORAGE_PREFIX + stageKey);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fall through */ }
  }
  return defaultStageState(stageKey);
}

function saveStage(){
  localStorage.setItem(STORAGE_PREFIX + currentStageKey, JSON.stringify(state));
  markStageUsed(currentStageKey);
}

function markStageUsed(stageKey){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(SESSION_STAGES_KEY) || "[]"); }catch(e){}
  if(!list.includes(stageKey)){ list.push(stageKey); }
  localStorage.setItem(SESSION_STAGES_KEY, JSON.stringify(list));
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(totalSeconds){
  totalSeconds = Math.max(0, Math.ceil(totalSeconds));
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds % 60;
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function currentElapsedSeconds(){
  // Total elapsed since Start Stage was first pressed, accounting for pauses.
  if(state.running && state.startEpoch){
    return state.elapsedAtPause + (Date.now() - state.startEpoch)/1000;
  }
  return state.elapsedAtPause;
}

function currentRemainingSeconds(){
  return state.duration - currentElapsedSeconds();
}

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }catch(e){ /* audio not available; ignore */ }
}

function tick(){
  const remaining = currentRemainingSeconds();
  const display = document.getElementById("timerDisplay");
  display.textContent = fmtTime(remaining);
  if(remaining <= 0 && !state.expired){
    state.expired = true;
    state.running = false;
    state.elapsedAtPause = state.duration;
    display.classList.add("expired");
    beep();
    stopTicking();
    saveStage();
    refreshLogButtonState();
  } else if(remaining > 0){
    display.classList.remove("expired");
  }
}

function startTicking(){
  stopTicking();
  timerInterval = setInterval(tick, 100);
}
function stopTicking(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function startStage(){
  if(state.running) return;
  if(state.expired) return; // must reset first
  state.running = true;
  state.startEpoch = Date.now();
  document.getElementById("timerDisplay").classList.remove("expired");
  startTicking();
  saveStage();
  refreshLogButtonState();
}

function pauseStage(){
  if(!state.running) return;
  state.elapsedAtPause = currentElapsedSeconds();
  state.running = false;
  state.startEpoch = null;
  stopTicking();
  tick();
  saveStage();
  refreshLogButtonState();
}

function resetStage(){
  if(!confirm("Reset the timer and shot log for this stage? This cannot be undone.")) return;
  stopTicking();
  state = defaultStageState(currentStageKey);
  document.getElementById("timerDisplay").classList.remove("expired");
  tick();
  saveStage();
  renderAll();
}

/* ============================================================
   PHASE 1 — LOG SHOT (no target interaction)
   ============================================================ */
function refreshLogButtonState(){
  // Log Shot is primarily for while the timer runs, but allowed anytime
  // (e.g., to correct shot count after the string), per spec.
  document.getElementById("logShotBtn").disabled = false;
}

function logShot(){
  const elapsed = currentElapsedSeconds();
  const split = (state.lastShotElapsed === null) ? elapsed : (elapsed - state.lastShotElapsed);
  state.lastShotElapsed = elapsed;
  const shotNum = state.shots.length + 1;
  state.shots.push({
    num: shotNum,
    score: null,   // pending
    x: null,
    y: null,
    split: split,
    elapsed: elapsed
  });
  saveStage();
  renderShotLog();
  renderStats();
  renderTargetMarkers();
  renderActiveShotInfo();
}

/* ============================================================
   PHASE 2 — TARGET RENDERING & SCORING
   ============================================================ */
function buildTargetSvg(){
  const svg = document.getElementById("targetSvg");
  svg.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";

  // Outer target face background
  const bg = document.createElementNS(ns,"circle");
  bg.setAttribute("cx",0); bg.setAttribute("cy",0);
  bg.setAttribute("r", SVG_HALF-2);
  bg.setAttribute("fill","#f4ecd8");
  bg.setAttribute("stroke","#333");
  bg.setAttribute("stroke-width","1");
  svg.appendChild(bg);

  // Draw rings largest (5) to smallest (X) so smaller rings sit on top.
  const drawOrder = [...RING_ORDER].reverse();
  drawOrder.forEach(ring=>{
    const diameterIn = RING_DIAMETERS_IN[ring];
    const radiusPx = (diameterIn/2) * pixelsPerInch;
    const circle = document.createElementNS(ns,"circle");
    circle.setAttribute("cx",0); circle.setAttribute("cy",0);
    circle.setAttribute("r", radiusPx);
    circle.setAttribute("fill", ring==="X" ? "#222" : "none");
    circle.setAttribute("stroke", "#222");
    circle.setAttribute("stroke-width", ring==="10" ? "1.5" : "1");
    svg.appendChild(circle);
  });

  // Ring number labels along the upper-right diagonal for reference.
  RING_ORDER.forEach(ring=>{
    if(ring==="X") return;
    const diameterIn = RING_DIAMETERS_IN[ring];
    const radiusPx = (diameterIn/2) * pixelsPerInch;
    const label = document.createElementNS(ns,"text");
    const ang = Math.PI/4;
    label.setAttribute("x", Math.cos(ang)*radiusPx*0.98 - 4);
    label.setAttribute("y", -Math.sin(ang)*radiusPx*0.98);
    label.setAttribute("font-size","6");
    label.setAttribute("fill","#555");
    label.textContent = ring;
    svg.appendChild(label);
  });

  // Group for shot markers, added/removed dynamically.
  const markerGroup = document.createElementNS(ns,"g");
  markerGroup.setAttribute("id","markerGroup");
  svg.appendChild(markerGroup);

  svg.addEventListener("click", onTargetClick);
}

function pixelToInches(svgX, svgY){
  // Signed inches from center. Y is negated because SVG y grows downward
  // but our convention is +Y = high (up). See sign-convention comment above.
  return { x: svgX / pixelsPerInch, y: -svgY / pixelsPerInch };
}

function inchesToScore(x,y){
  const distIn = Math.sqrt(x*x + y*y);
  for(const ring of RING_ORDER){
    if(distIn <= RING_DIAMETERS_IN[ring]/2) return ring;
  }
  return "M"; // outside the 5-ring = Miss
}

function onTargetClick(evt){
  const shot = getActiveShot();
  if(!shot){ return; }
  const svg = document.getElementById("targetSvg");
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  const inches = pixelToInches(loc.x, loc.y);
  const score = inchesToScore(inches.x, inches.y);
  applyScoreToShot(shot, score, inches.x, inches.y);
}

function applyScoreToShot(shot, score, x, y){
  shot.score = score;
  shot.x = (x===undefined) ? null : round2(x);
  shot.y = (y===undefined) ? null : round2(y);
  saveStage();
  renderShotLog();
  renderStats();
  renderTargetMarkers();
  autoAdvanceActive();
}

function round2(n){ return Math.round(n*100)/100; }

function getActiveShot(){
  if(activeShotNum !== null){
    const s = state.shots.find(sh=>sh.num===activeShotNum);
    if(s) return s;
  }
  // default: lowest-numbered unscored shot
  return state.shots.find(sh=>sh.score===null) || null;
}

let activeShotNum = null; // explicit user selection; null = auto (lowest unscored)

function setActiveShot(num){
  activeShotNum = num;
  renderShotLog();
  renderActiveShotInfo();
}

function autoAdvanceActive(){
  const next = state.shots.find(sh=>sh.score===null);
  activeShotNum = next ? next.num : null;
  renderShotLog();
  renderActiveShotInfo();
}

function renderTargetMarkers(){
  const group = document.getElementById("markerGroup");
  if(!group) return;
  group.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";
  state.shots.forEach(shot=>{
    if(shot.x===null || shot.y===null) return; // score-only shots have no location
    const svgX = shot.x * pixelsPerInch;
    const svgY = -shot.y * pixelsPerInch;
    const dot = document.createElementNS(ns,"circle");
    dot.setAttribute("cx",svgX); dot.setAttribute("cy",svgY);
    dot.setAttribute("r","5");
    dot.setAttribute("fill","#c0392b");
    dot.setAttribute("stroke","#fff");
    dot.setAttribute("stroke-width","1");
    group.appendChild(dot);
    const label = document.createElementNS(ns,"text");
    label.setAttribute("x", svgX+6);
    label.setAttribute("y", svgY-6);
    label.setAttribute("font-size","8");
    label.setAttribute("font-weight","bold");
    label.setAttribute("fill","#c0392b");
    label.textContent = shot.num;
    group.appendChild(label);
  });
}

function buildScoreButtons(){
  const wrap = document.getElementById("scoreButtons");
  wrap.innerHTML = "";
  const labels = ["X","10","9","8","7","6","5","Miss"];
  labels.forEach(lbl=>{
    const btn = document.createElement("button");
    btn.textContent = lbl;
    btn.addEventListener("click", ()=>{
      const shot = getActiveShot();
      if(!shot) return;
      const score = (lbl==="Miss") ? "M" : lbl;
      applyScoreToShot(shot, score, undefined, undefined); // score-only: no X/Y
    });
    wrap.appendChild(btn);
  });
}

function renderActiveShotInfo(){
  const info = document.getElementById("activeShotInfo");
  const shot = getActiveShot();
  if(!shot){
    info.textContent = state.shots.length ? "All shots scored." : "No pending shots.";
  } else {
    info.innerHTML = "Active shot: <b>#" + shot.num + "</b> — tap target or a score button to record it.";
  }
}

/* ============================================================
   SHOT LOG TABLE
   ============================================================ */
function renderShotLog(){
  const body = document.getElementById("shotLogBody");
  body.innerHTML = "";
  const active = getActiveShot();
  state.shots.forEach(shot=>{
    const tr = document.createElement("tr");
    if(shot.score===null) tr.classList.add("pending");
    if(active && shot.num===active.num) tr.classList.add("active");
    const loc = (shot.x!==null && shot.y!==null) ? (shot.x.toFixed(2)+", "+shot.y.toFixed(2)) : "—";
    tr.innerHTML =
      "<td>"+shot.num+"</td>" +
      "<td>"+(shot.score===null ? "pending" : shot.score)+"</td>" +
      "<td>"+shot.split.toFixed(1)+"s</td>" +
      "<td>"+shot.elapsed.toFixed(1)+"s</td>" +
      "<td>"+loc+"</td>";
    tr.addEventListener("click", ()=> setActiveShot(shot.num));
    body.appendChild(tr);
  });
  document.getElementById("shotCountBig").textContent = "Shots fired this stage: " + state.shots.length;
}

/* ============================================================
   STATS
   Total score sums numeric ring values (X counts as 10 toward
   score, tallied separately as X-count). Misses count as 0.
   Centroid uses only shots with recorded X/Y (score-only shots
   are excluded), per spec.
   ============================================================ */
function scoreValue(score){
  if(score===null) return 0;
  if(score==="X") return 10;
  if(score==="M") return 0;
  return Number(score);
}

function renderStats(){
  let totalScore = 0, xCount = 0, splitSum = 0, splitCount = 0;
  let sumX=0, sumY=0, locCount=0;
  state.shots.forEach(shot=>{
    if(shot.score!==null){
      totalScore += scoreValue(shot.score);
      if(shot.score==="X") xCount++;
    }
    splitSum += shot.split;
    splitCount++;
    if(shot.x!==null && shot.y!==null){
      sumX += shot.x; sumY += shot.y; locCount++;
    }
  });
  document.getElementById("statScore").textContent = totalScore;
  document.getElementById("statX").textContent = xCount;
  document.getElementById("statSplit").textContent = splitCount ? (splitSum/splitCount).toFixed(2) : "--";

  const centroidEl = document.getElementById("statCentroid");
  if(locCount===0){
    centroidEl.textContent = "--";
  } else {
    const meanX = sumX/locCount, meanY = sumY/locCount;
    const vParts = [];
    if(Math.abs(meanY) > 0.005) vParts.push(Math.abs(meanY).toFixed(2)+"in "+(meanY>=0?"High":"Low"));
    if(Math.abs(meanX) > 0.005) vParts.push(Math.abs(meanX).toFixed(2)+"in "+(meanX>=0?"Right":"Left"));
    centroidEl.textContent = vParts.length ? vParts.join(" / ") : "Centered";
  }
}

/* ============================================================
   STAGE SELECTOR
   ============================================================ */
function buildStageSelect(){
  const sel = document.getElementById("stageSelect");
  sel.innerHTML = "";
  STAGES.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s.key;
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
  sel.value = currentStageKey;
  sel.addEventListener("change", onStageChange);
}

function onStageChange(evt){
  const newKey = evt.target.value;
  if(newKey === currentStageKey) return;
  const hasData = state.shots.length > 0;
  if(hasData){
    const proceed = confirm(
      "Switching stages will save the current stage's data automatically (it is already autosaved). " +
      "Continue to \"" + STAGES.find(s=>s.key===newKey).name + "\"?"
    );
    if(!proceed){
      evt.target.value = currentStageKey; // revert selection
      return;
    }
  }
  saveStage(); // ensure latest is flushed
  stopTicking();
  currentStageKey = newKey;
  state = loadStage(currentStageKey);
  activeShotNum = null;
  renderAll();
  if(state.running){ startTicking(); }
}

/* ============================================================
   EXPORT / CLEAR SESSION
   ============================================================ */
function exportCsv(){
  let usedKeys = [];
  try{ usedKeys = JSON.parse(localStorage.getItem(SESSION_STAGES_KEY) || "[]"); }catch(e){}
  if(!usedKeys.includes(currentStageKey)) usedKeys.push(currentStageKey);

  const rows = [["Stage","Shot#","Score","Split(s)","Elapsed(s)","X(in)","Y(in)"]];
  usedKeys.forEach(key=>{
    const st = (key===currentStageKey) ? state : loadStage(key);
    const stageDef = STAGES.find(s=>s.key===key);
    const stageName = stageDef ? stageDef.name : key;
    st.shots.forEach(shot=>{
      rows.push([
        stageName,
        shot.num,
        shot.score===null ? "" : shot.score,
        shot.split.toFixed(2),
        shot.elapsed.toFixed(2),
        shot.x===null ? "" : shot.x.toFixed(2),
        shot.y===null ? "" : shot.y.toFixed(2)
      ]);
    });
  });

  const csv = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cmp_m1_session_" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function csvEscape(v){
  const s = String(v);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function clearSession(){
  const first = confirm("Clear ALL stages and start a new session? This deletes every logged shot and cannot be undone.");
  if(!first) return;
  const second = confirm("Are you absolutely sure? This is your final confirmation to erase all session data.");
  if(!second) return;

  let usedKeys = [];
  try{ usedKeys = JSON.parse(localStorage.getItem(SESSION_STAGES_KEY) || "[]"); }catch(e){}
  usedKeys.forEach(key=> localStorage.removeItem(STORAGE_PREFIX+key));
  localStorage.removeItem(SESSION_STAGES_KEY);

  stopTicking();
  currentStageKey = STAGES[0].key;
  state = defaultStageState(currentStageKey);
  activeShotNum = null;
  document.getElementById("stageSelect").value = currentStageKey;
  document.getElementById("timerDisplay").classList.remove("expired");
  renderAll();
}

/* ============================================================
   RENDER ALL / INIT
   ============================================================ */
function renderAll(){
  document.getElementById("stageLabel").textContent = STAGES.find(s=>s.key===currentStageKey).name;
  tick();
  refreshLogButtonState();
  renderShotLog();
  renderStats();
  renderTargetMarkers();
  renderActiveShotInfo();
}

function init(){
  buildStageSelect();
  state = loadStage(currentStageKey);
  buildTargetSvg();
  buildScoreButtons();
  renderAll();
  if(state.running){ startTicking(); }

  document.getElementById("startBtn").addEventListener("click", startStage);
  document.getElementById("pauseBtn").addEventListener("click", pauseStage);
  document.getElementById("resetBtn").addEventListener("click", resetStage);
  document.getElementById("logShotBtn").addEventListener("click", logShot);
  document.getElementById("exportBtn").addEventListener("click", exportCsv);
  document.getElementById("clearBtn").addEventListener("click", clearSession);

  window.addEventListener("beforeunload", saveStage);
}

init();
})();
</script>
